[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "norbok"
version = "0.1.2"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50,<2",
    "rich>=13.0,<14",
    "prompt-toolkit>=3.0,<4",
    "pygments>=2.17,<3",
]

[project.scripts]
norbok = "norbok.main:run"

[tool.setuptools.packages.find]
include = ["norbok*"]
